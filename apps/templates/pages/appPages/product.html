{% extends 'layouts/dashboard_layout.html' %} {% block content %}

<div id="app">
   <!--! ================================================================ !-->
   <!--! [Start] Navigation Section !-->
   <!--! ================================================================ !-->
   {% include 'components/nav_dashboard.html' %}
   <!--! ================================================================ !-->
   <!--! [End] Navigation Section !-->
   <!--! ================================================================ !-->

   <!--! ================================================================ !-->
   <!--! [Start] Page Content !-->
   <!--! ================================================================ !-->
   <div id="main">
      <!--! ================================================================ !-->
      <!--! [Start] Burger Button !-->
      <!--! ================================================================ !-->
      <header class="mb-3">
         <a href="#" class="burger-btn d-block d-xl-none">
            <i class="bi bi-justify fs-3"></i>
         </a>
      </header>
      <!--! ================================================================ !-->
      <!--! [End] Burger Button !-->
      <!--! ================================================================ !-->

      <!--! ================================================================ !-->
      <!--! [Start] Main Content !-->
      <!--! ================================================================ !-->
      <div class="page-heading">
         <!--! ================================================================ !-->
         <!--! [Start] Header !-->
         <div class="page-title">
            <div class="row">
               <div class="col-12 col-md-6 order-md-1 order-last">
                  <h3>DATA BARANG</h3>
                  <!-- <p class="text-subtitle text-muted">The default layout</p> -->
               </div>
               <div class="col-12 col-md-6 order-md-2 order-first">
                  <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                     <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                           <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">Barang</li>
                     </ol>
                  </nav>
               </div>
            </div>
         </div>
         <!--! [End] Header !-->
         <!--! ================================================================ !-->

         <!--! ================================================================ !-->
         <!--! [Start] Title !-->
         <section class="section">
            <div class="card">
               <div class="card-body">
                  <div class="row">
                     <div class="col-sm-12 d-flex justify-content-end">
                        <a href="#" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#product_modal"> Tambah</a>
                     </div>
                  </div>
               </div>
            </div>
         </section>
         <!--! [End] Title !-->
         <!--! ================================================================ !-->

         <!--! ================================================================ !-->
         <!--! [Start] Header !-->
         <section class="section">
            <div class="card">
               <!-- <div class="card-header">Simple Datatable</div> -->
               <div class="card-body">
                  <table class="table table-striped" id="table1">
                     <thead>
                        <tr>
                           <th>No</th>
                           <th>Nama Barang</th>
                           <th>Kategori</th>
                           <th>Stok</th>
                           <th>Harga Beli</th>
                           <th>Harga Jual</th>
                           <th>Aksi</th>
                        </tr>
                     </thead>
                     <tbody id="product_table">
                        <!-- row table set at javascript -->
                     </tbody>
                  </table>
               </div>
            </div>
         </section>
         <!--! [End] Header !-->
         <!--! ================================================================ !-->
      </div>
      <!--! ================================================================ !-->
      <!--! [End] Main Content !-->
      <!--! ================================================================ !-->

      <!--! ================================================================ !-->
      <!--! [Start] Footer !-->
      {% include 'components/footer_dashboard.html' %}
      <!--! [End] Footer !-->
      <!--! ================================================================ !-->

      <!--! ================================================================ !-->
      <!--! [Start] Modal Form !-->
      <div class="modal fade text-left" id="product_modal" tabindex="-1" role="dialog" aria-labelledby="modal_label" aria-hidden="true">
         <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
            <div class="modal-content">
               <div class="modal-header">
                  <h4 class="modal-title" id="modal_label">Tambah Barang</h4>
                  <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                     <i data-feather="x"></i>
                  </button>
               </div>
               <form action="#">
                  <div class="modal-body">
                     <input type="hidden" id="product_id">
                     <label>Kategori</label>
                     <select id="product_category" class="form-control">
                        <!-- Select options set at javascript -->
                     </select>
                     <label>Nama Barang</label>
                     <input type="text" id="product_name" class="form-control" />
                     <label>Stok</label>
                     <input type="number" id="product_stock" class="form-control" />
                     <label>Harga Beli</label>
                     <input type="number" id="product_purchase" class="form-control" />
                     <label>Harga Jual</label>
                     <input type="number" id="product_price" class="form-control" />
                  </div>
                  <div class="modal-footer">
                     <button type="button" class="btn btn-light-secondary" data-bs-dismiss="modal">
                        <i class="bx bx-x d-block d-sm-none"></i>
                        <span class="d-none d-sm-block">Tutup</span>
                     </button>
                     <button type="button" class="btn btn-primary btn-save">Simpan</button>
                  </div>
               </form>
            </div>
         </div>
      </div>
      <!--! [End] Modal Form !-->
      <!--! ================================================================ !-->
   </div>
   <!--! ================================================================ !-->
   <!--! [End] Page Content !-->
   <!--! ================================================================ !-->
</div>

<script src="{{ url_for('static', filename='javascript/api/products.js') }}"></script>
{% endblock %}
