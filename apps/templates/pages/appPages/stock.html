{% extends 'layouts/dashboard_layout.html' %} {% block content %}

<div id="app">
   <!--! ================================================================ !-->
   <!--! [Start] Navigation Section !-->
   <!--! ================================================================ !-->
   {% include 'components/nav_dashboard.html' %}
   <!--! ================================================================ !-->
   <!--! [End] Navigation Section !-->
   <!--! ================================================================ !-->

   <!--! ================================================================ !-->
   <!--! [Start] Page Content !-->
   <!--! ================================================================ !-->
   <div id="main">
      <!--! ================================================================ !-->
      <!--! [Start] Burger Button !-->
      <!--! ================================================================ !-->
      <header class="mb-3">
         <a href="#" class="burger-btn d-block d-xl-none">
            <i class="bi bi-justify fs-3"></i>
         </a>
      </header>
      <!--! ================================================================ !-->
      <!--! [End] Burger Button !-->
      <!--! ================================================================ !-->

      <!--! ================================================================ !-->
      <!--! [Start] Main Content !-->
      <!--! ================================================================ !-->
      <div class="page-heading">
         <!--! ================================================================ !-->
         <!--! [Start] Header !-->
         <div class="page-title">
            <div class="row">
               <div class="col-12 col-md-6 order-md-1 order-last">
                  <h3>Stock Barang</h3>
                  <!-- <p class="text-subtitle text-muted">The default layout</p> -->
               </div>
               <div class="col-12 col-md-6 order-md-2 order-first">
                  <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                     <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="index.html">Beranda</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Stock Barang</li>
                     </ol>
                  </nav>
               </div>
            </div>
         </div>
         <!--! [End] Header !-->
         <!--! ================================================================ !-->

         <!--! ================================================================ !-->
         <!--! [Start] Title !-->
         <section class="section">
            <div class="card">
               <div class="card-body">
                  <div class="row">
                     <div class="col-sm-12 d-flex justify-content-end">
                        <a href="#" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addProductModal"> Tambah</a>
                     </div>
                  </div>
               </div>
            </div>
         </section>
         <!--! [End] Title !-->
         <!--! ================================================================ !-->

         <!--! ================================================================ !-->
         <!--! [Start] Content !-->
         <section class="section">
            <div class="card">
               <!-- <div class="card-header">Simple Datatable</div> -->
               <div class="card-body">
                  <table class="table table-striped" id="table1">
                     <thead>
                        <tr>
                           <th>No</th>
                           <th>Name</th>
                           <th>Category</th>
                           <th>Action</th>
                        </tr>
                     </thead>
                     <tbody id="productTable">
                        <!-- List data diproses oleh JavaScript -->
                     </tbody>
                  </table>
               </div>
            </div>
         </section>
         <!--! [End] Content !-->
         <!--! ================================================================ !-->
      </div>
      <!--! ================================================================ !-->
      <!--! [End] Main Content !-->
      <!--! ================================================================ !-->

      <!--! ================================================================ !-->
      <!--! [Start] Footer !-->
      {% include 'components/footer_dashboard.html' %}
      <!--! [End] Footer !-->
      <!--! ================================================================ !-->

      <!--! ================================================================ !-->
      <!--! [Start] Modal Form !-->
      <div class="modal fade text-left" id="product_modal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel33" aria-hidden="true">
         <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
            <div class="modal-content">
               <div class="modal-header">
                  <h4 class="modal-title" id="modal_label">Tambah Produk</h4>
                  <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                     <i data-feather="x"></i>
                  </button>
               </div>
               <form action="#" id="product_form">
                  <div class="modal-body">
                     <input type="hidden" id="product_id" />
                     <label>Nama Produk: </label>
                     <div class="form-group">
                        <input type="text" id="product_name" placeholder="Nama Produk" class="form-control" />
                     </div>
                     <label>Kategori: </label>
                     <div class="form-group">
                        <select class="form-select" id="product_category">
                           <!-- <option selected>Pilih...</option> -->
                        </select>
                     </div>
                  </div>
                  <div class="modal-footer">
                     <button type="button" class="btn btn-light-secondary" data-bs-dismiss="modal">
                        <i class="bx bx-x d-block d-sm-none"></i>
                        <span class="d-none d-sm-block">Tutup</span>
                     </button>
                     <button type="button" class="btn btn-primary btn-save">Simpan</button>
                  </div>
               </form>
            </div>
         </div>
      </div>
      <!--! [End] Modal Form !-->
      <!--! ================================================================ !-->
   </div>
   <!--! ================================================================ !-->
   <!--! [End] Page Content !-->
   <!--! ================================================================ !-->
</div>

<script src="{{ url_for('static', filename='javascript/backend/products.js') }}"></script>
{% endblock %}
