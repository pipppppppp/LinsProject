{% extends 'layouts/dashboard_layout.html' %} {% block content %}

<div id="app">
  <!-- Navigation -->
  {% include 'components/nav_dashboard.html' %}

  <div id="main">
    <!-- Burger -->
    <header class="mb-3">
      <a href="#" class="burger-btn d-block d-xl-none">
        <i class="bi bi-justify fs-3"></i>
      </a>
    </header>

    <div class="page-heading">
      <!-- Header -->
      <div class="page-title">
        <div class="row">
          <div class="col-12 col-md-6 order-md-1 order-last">
            <h3>PROFIL BENGKEL</h3>
          </div>

          <div class="col-12 col-md-6 order-md-2 order-first">
            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
              <ol class="breadcrumb">
                <li class="breadcrumb-item">
                  <a href="{{ url_for('dashboard.index') }}"> Dashboard </a>
                </li>

                <li class="breadcrumb-item active" aria-current="page">Profil Bengkel</li>
              </ol>
            </nav>
          </div>
        </div>
      </div>

      <!-- Content -->
      <section class="section">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title">Informasi Bengkel</h4>
          </div>

          <div class="card-body">
            <input type="hidden" id="workshop_id" />
            <!-- Logo Bengkel -->
            <div class="text-center mb-4">
              <img
                id="preview_logo"
                src="{{ url_for('static', filename='images/profiles/default-workshop.png') }}"
                class="rounded-circle border shadow-sm"
                style="width: 180px; height: 180px; object-fit: cover"
              />
            </div>
            <div class="text-center">
              <input type="file" id="workshop_logo" class="form-control" accept="image/*" />
            </div>
            <br />
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label>Nama Bengkel</label>

                  <input type="text" id="workshop_name" class="form-control" placeholder="Nama Bengkel" />
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group">
                  <label>Email</label>

                  <input type="email" id="workshop_email" class="form-control" placeholder="Email Bengkel" />
                </div>
              </div>
            </div>

            <div class="row mt-3">
              <div class="col-md-6">
                <div class="form-group">
                  <label>No. Telepon</label>

                  <input type="text" id="workshop_phone" class="form-control" placeholder="Nomor Telepon" />
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group">
                  <label>Status</label>

                  <input type="text" id="workshop_status" class="form-control" readonly />
                </div>
              </div>
            </div>

            <div class="form-group mt-3">
              <label>Alamat</label>

              <textarea id="workshop_address" rows="4" class="form-control" placeholder="Alamat Bengkel"></textarea>
            </div>

            <div class="mt-4 text-end">
              <button class="btn btn-primary btn-save">
                <i class="bi bi-save"></i>

                Simpan Perubahan
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    {% include 'components/footer_dashboard.html' %}
  </div>
</div>

<script src="{{ url_for('static', filename='javascript/helper/utilities.js') }}"></script>
<script src="{{ url_for('static', filename='javascript/helper/formatter.js') }}"></script>
<script src="{{ url_for('static', filename='javascript/helper/swal.js') }}"></script>
<script src="{{ url_for('static', filename='javascript/helper/validators.js') }}"></script>

<script src="{{ url_for('static', filename='javascript/api/workshop.js') }}"></script>

{% endblock %}
