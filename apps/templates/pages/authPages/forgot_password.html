<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lupa Password - POS Bengkel</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/signin.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='vendors/bootstrap-icons/bootstrap-icons.css') }}" />
  </head>

  <body>
    <div id="auth">
      <div class="row h-100">
        <!-- ====================================================== -->
        <!-- LEFT SIDE -->
        <!-- ====================================================== -->
        <div class="col-lg-5 col-12">
          <div id="auth-left">
            <div class="card shadow-lg login-card border-0">
              <div class="card-body p-5">
                <div class="text-center mb-4">
                  <h2 class="login-title">Lupa Password</h2>

                  <p class="login-subtitle">Masukkan email yang terdaftar untuk mengatur ulang password.</p>
                </div>

                <!-- ====================================================== -->
                <!-- FORGOT PASSWORD FORM -->
                <!-- ====================================================== -->
                <form id="forgot_password_form" action="/auth/forgot-password" method="POST">
                  <!-- Email -->
                  <div class="form-group position-relative has-icon-left mb-4">
                    <input id="email" type="email" name="email" class="form-control form-control-xl" placeholder="Email" required />

                    <div class="form-control-icon">
                      <i class="bi bi-envelope"></i>
                    </div>
                  </div>

                  <!-- Button -->
                  <button type="submit" class="btn btn-primary btn-lg w-100 btn-login">Kirim Link Reset Password</button>

                  <!-- Back To Login -->
                  <div class="text-center mt-4">
                    <span class="text-muted"> Sudah ingat password? </span>

                    <a href="{{ url_for('auth.signin_page') }}" class="login-link"> Login </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- ====================================================== -->
        <!-- RIGHT SIDE -->
        <!-- ====================================================== -->
        <div class="col-lg-7 d-none d-lg-block">
          <div id="auth-right">
            <div class="hero-content">
              <img src="{{ url_for('static', filename='images/items/logopos.png') }}" class="logo-right mb-4" />

              <h1 class="display-5 fw-bold text-white mb-3">POS Bengkel</h1>

              <p class="text-white-50 fs-5 mb-5">Kelola seluruh operasional bengkel dalam satu aplikasi modern.</p>

              <div class="feature-box">
                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Multi Bengkel
                </div>

                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Produk & Jasa
                </div>

                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Dashboard Real-Time
                </div>

                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Pembelian & Penjualan
                </div>

                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Laporan Lengkap
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="{{ url_for('static', filename='javascript/helper/swal.js') }}"></script>

    <script src="{{ url_for('static', filename='javascript/api/auth.js') }}"></script>
  </body>
</html>
