<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password - POS Bengkel Motor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/signin.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='vendors/bootstrap-icons/bootstrap-icons.css') }}" />
  </head>

  <body>
    <div id="auth">
      <div class="row h-100">
        <!-- ====================================================== -->
        <!-- LEFT SIDE -->
        <!-- ====================================================== -->
        <div class="col-lg-5 col-12">
          <div id="auth-left">
            <div class="card shadow-lg login-card border-0">
              <div class="card-body p-5">
                <div class="text-center mb-4">
                  <h2 class="login-title">Reset Password</h2>

                  <p class="login-subtitle">Masukkan password baru untuk akun Anda.</p>
                </div>

                <!-- ====================================================== -->
                <!-- RESET PASSWORD FORM -->
                <!-- ====================================================== -->
                <form id="reset_password_form">
                  <!-- Token -->
                  <input type="hidden" id="reset_token" value="{{ token }}" />

                  <!-- Password -->
                  <div class="form-group position-relative has-icon-left mb-4">
                    <input
                      id="new_password"
                      type="password"
                      name="password"
                      class="form-control form-control-xl"
                      placeholder="Password Baru"
                      required
                    />

                    <div class="form-control-icon">
                      <i class="bi bi-shield-lock"></i>
                    </div>
                  </div>

                  <!-- Konfirmasi Password -->
                  <div class="form-group position-relative has-icon-left mb-4">
                    <input
                      id="retype_password"
                      type="password"
                      name="retype_password"
                      class="form-control form-control-xl"
                      placeholder="Konfirmasi Password"
                      required
                    />

                    <div class="form-control-icon">
                      <i class="bi bi-shield-check"></i>
                    </div>
                  </div>

                  <!-- Button -->
                  <button type="submit" class="btn btn-primary btn-lg w-100 btn-login">Ubah Password</button>

                  <!-- Back To Login -->
                  <div class="text-center mt-4">
                    <a href="{{ url_for('auth.signin_page') }}" class="login-link"> Kembali ke Login </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- ====================================================== -->
        <!-- RIGHT SIDE -->
        <!-- ====================================================== -->
        <div class="col-lg-7 d-none d-lg-block">
          <div id="auth-right">
            <div class="hero-content">
              <img src="{{ url_for('static', filename='images/items/logopos.png') }}" class="logo-right mb-4" />

              <h1 class="display-5 fw-bold text-white mb-3">POS Bengkel</h1>

              <p class="text-white-50 fs-5 mb-5">Kelola seluruh operasional bengkel dalam satu aplikasi modern.</p>

              <div class="feature-box">
                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Multi Bengkel
                </div>

                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Produk & Jasa
                </div>

                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Dashboard Real-Time
                </div>

                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Pembelian & Penjualan
                </div>

                <div>
                  <i class="bi bi-check-circle-fill"></i>
                  Laporan Lengkap
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="{{ url_for('static', filename='javascript/helper/swal.js') }}"></script>

    <script src="{{ url_for('static', filename='javascript/api/auth.js') }}"></script>
  </body>
</html>
