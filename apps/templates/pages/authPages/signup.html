{% extends 'layouts/dashboard_layout.html' %} {% block content %}

<div id="auth">
   <div class="row h-100">
      <div class="col-lg-5 col-12">
         <div id="auth-left">
            <div class="card shadow-lg login-card">
               <div class="card-body p-5">
                  <div class="text-center mb-4">
                     <h3 class="fw-bold">Login</h3>

                     <p class="text-muted">Sistem Informasi POS Bengkel Motor</p>
                  </div>

                  <form id="signup_form">
                     <div class="form-group position-relative has-icon-left mb-4">
                        <input type="text" name="username" id="username" class="form-control form-control-xl" placeholder="Username" required />
                        <div class="form-control-icon">
                           <i class="bi bi-person"></i>
                        </div>
                     </div>

                     <div class="form-group position-relative has-icon-left mb-4">
                        <input type="text" name="email" id="email" class="form-control form-control-xl" placeholder="Alamat Email" required />
                        <div class="form-control-icon">
                           <i class="bi bi-person"></i>
                        </div>
                     </div>

                     <div class="form-group position-relative has-icon-left mb-4">
                        <input type="password" name="password" id="password" class="form-control form-control-xl" placeholder="Kata Sandi" required />
                        <div class="form-control-icon">
                           <i class="bi bi-shield-lock"></i>
                        </div>
                     </div>
                     <div class="form-group position-relative has-icon-left mb-4">
                        <input type="password" name="retype_password" id="retype_password" class="form-control form-control-xl" placeholder="Ulang Kata Sandi" required />
                        <div class="form-control-icon">
                           <i class="bi bi-shield-lock"></i>
                        </div>
                     </div>

                     <div class="form-group position-relative has-icon-left mb-4">
                        <input type="text" name="workshop_name" id="workshop_name" class="form-control form-control-xl" placeholder="Nama Bengkel" required />
                        <div class="form-control-icon">
                           <i class="bi bi-shield-lock"></i>
                        </div>
                     </div>

                     <div class="form-group position-relative has-icon-left mb-4">
                        <input type="text" name="workshop_phone" id="workshop_phone" class="form-control form-control-xl" placeholder="No. Telp Bengkel" required />
                        <div class="form-control-icon">
                           <i class="bi bi-shield-lock"></i>
                        </div>
                     </div>

                     <div class="form-group position-relative has-icon-left mb-4">
                        <textarea name="workshop_address" id="workshop_address" class="form-control form-control-xl" placeholder="Alamat Bengkel" required id="floatingTextarea"></textarea>
                        <div class="form-control-icon">
                           <i class="bi bi-shield-lock"></i>
                        </div>
                     </div>

                     <button type="submit" class="btn btn-primary btn-lg w-100 btn-submit">Daftar Akun Baru</button>
                  </form>
                  <div class="text-center mt-4">
                     <span class="text-muted"> Sudah punya akun? </span>
                     <a href="{{ url_for('auth.signin_page') }}" class="login-link"> Login Sekarang </a>
                  </div>
               </div>
            </div>
         </div>
      </div>

      <div class="col-lg-7 d-none d-lg-block">
         <div id="auth-right">
            <div class="text-center text-white">
               <img src="{{ url_for('static', filename='images/items/logopos.png') }}" class="logo-right mb-4" />

               <h1 class="fw-bold text-white">POS Bengkel Motor</h1>

               <p class="fs-4 text-white">Sistem Informasi Point Of Sale</p>

               <p class="text-light">Kelola Transaksi dan Stok Bengkel Motor</p>
            </div>
         </div>
      </div>
   </div>
</div>

<!--! ================================================================ !-->
<!--! [Start] Javascrpt Modul !-->
<script src="{{ url_for('static', filename='javascript/api/auth.js') }}"></script>
<!--! [End] Javascrpt Modul !-->
<!--! ================================================================ !-->

{% endblock %}
